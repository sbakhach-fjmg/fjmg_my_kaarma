[project]
name = "mykaarma"
version = "0.1.0"
description = "myKaarma API client: department access and recommended work by VIN"
readme = "README.md"
authors = [
    { name = "Shafeek", email = "sbakhach@fletcherjones.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mssql-python==1.15.0",
]

[project.scripts]
mykaarma = "mykaarma.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
